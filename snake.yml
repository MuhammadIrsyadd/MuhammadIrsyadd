name: generate animation

on:
  schedule:
    - cron: "0 */6 * * *"   # jalan tiap 6 jam sekali, bisa diubah sesuai kebutuhan
  workflow_dispatch: {}      # supaya bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main                 # otomatis jalan tiap ada push ke branch main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
